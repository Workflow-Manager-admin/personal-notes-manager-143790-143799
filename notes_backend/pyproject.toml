[tool.black]
line-length = 88
target-version = ['py311']
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["flask", "flask_smorest", "marshmallow", "webargs", "Werkzeug", "flask_cors"]

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # Whitespace before ':', compatible with black
    "W503",  # Line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "env",
    "venv",
    ".venv",
    "migrations",
    "interfaces/openapi.json",
]
